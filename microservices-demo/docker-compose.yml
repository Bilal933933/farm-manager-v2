services:
  postgres:
    image: postgres:15-alpine
    container_name: farm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: farm_erp
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farm_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: farm-gateway
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8000
      DB_HOST: postgres
      DB_DATABASE: farm_erp
      DB_USERNAME: farm
      DB_PASSWORD: farm_secret
      AUTH_SERVICE_URL: http://auth-service:8001
      LAND_SERVICE_URL: http://land-service:8002
      INVENTORY_SERVICE_URL: http://inventory-service:8003
    volumes:
      - ./api-gateway:/var/www/html

  auth-service:
    build: ./services/auth-service
    container_name: farm-auth
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8001
      DB_HOST: postgres
      DB_DATABASE: farm_erp
      DB_USERNAME: farm
      DB_PASSWORD: farm_secret
      DB_SCHEMA: auth
    volumes:
      - ./services/auth-service:/var/www/html

  land-service:
    build: ./services/land-service
    container_name: farm-land
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8002
      DB_HOST: postgres
      DB_DATABASE: farm_erp
      DB_USERNAME: farm
      DB_PASSWORD: farm_secret
      DB_SCHEMA: land
    volumes:
      - ./services/land-service:/var/www/html

  inventory-service:
    build: ./services/inventory-service
    container_name: farm-inventory
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 8003
      DB_HOST: postgres
      DB_DATABASE: farm_erp
      DB_USERNAME: farm
      DB_PASSWORD: farm_secret
      DB_SCHEMA: inventory
    volumes:
      - ./services/inventory-service:/var/www/html

volumes:
  pgdata:
